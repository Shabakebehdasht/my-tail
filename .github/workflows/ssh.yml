name: sadaf

on:
  schedule:
    - cron: '0 */6 * * *'  # روشن شدن خودکار هر ۶ ساعت یک‌بار (۲۴/۷)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REPO_ORIGIN: https://github.com/Shabakebehdasht/h-dashboard.git
      WF_NAME: sadaf

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 2. Setup OpenSSH Server & Set Runner Password
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:${{ secrets.RUNNER_PASSWORD }}" | sudo chpasswd
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo systemctl enable ssh

      - name: 3. Setup npm, PATH, and Environment Variables Persistently
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'

          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.bashrc
          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.profile
          export PATH="$HOME/.npm-global/bin:$PATH"

          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.bashrc
          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.profile
          echo "GH_TOKEN=$GH_TOKEN" | sudo tee -a /etc/environment

          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.bashrc
          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.profile
          echo 'INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' | sudo tee -a /etc/environment

      - name: 4. Install PHP 8.5 & Composer (Laravel + pgsql + redis)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            php8.5 php8.5-cli php8.5-common php8.5-fpm \
            php8.5-mbstring php8.5-xml php8.5-pgsql php8.5-curl php8.5-zip php8.5-bcmath php8.5-intl php8.5-gd \
            php8.5-redis php8.5-tokenizer php8.5-fileinfo php8.5-ctype \
            unzip
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"

      - name: 5. Connect Tailscale as Exit Node & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="${{ env.WF_NAME }}" --advertise-exit-node --accept-routes --accept-dns

          # Enable IP forwarding (required for exit node to route traffic)
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p /etc/sysctl.conf

          TS_IP=$(sudo tailscale ip -4)
          echo "=================================================="
          echo "  >>> SSH & WEB SERVER ARE LIVE! <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  Username      : runner"
          echo "  Password      : ${{ secrets.RUNNER_PASSWORD }}"
          echo "  ------------------------------------------------"
          echo "  💻 SSH: ssh runner@$TS_IP"
          echo "  🌐 Web : http://$TS_IP:8000  (Laravel)"
          echo "  🔀 9Router: http://$TS_IP:20128  (dashboard)"
          echo "  💾 Project: /home/runner/h-dashboard"
          echo "  🌍 Exit Node: Enabled (advertise-exit-node)"
          echo "=================================================="

      - name: 6. Authenticate gh CLI & configure git credential helper
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          unset GH_TOKEN
          echo "${{ secrets.MY_PAT }}" | gh auth login --with-token
          gh auth setup-git
          gh auth status
          echo "✅ GitHub CLI authenticated as: $(gh api user -q .login)"

      - name: 7. Clone Project (from new repo and branch)
        run: |
          cd /home/runner
          rm -rf h-dashboard
          git clone -b beta "$REPO_ORIGIN"
          cd h-dashboard
          if [ -f .env-example-github ]; then
            cp .env-example-github .env
            echo "✅ Cloned and copied .env-example-github → .env"
          else
            echo "❌ .env-example-github not found in beta branch"
            ls -la .env* 2>&1
            exit 1
          fi

      - name: 8. Inject Secrets into .env
        env:
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          SUPA_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPA_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REDIS_H: ${{ secrets.REDIS_HOST }}
          REDIS_P: ${{ secrets.REDIS_PASSWORD }}
          REDIS_U: ${{ secrets.REDIS_URL }}
        run: |
          cd /home/runner/h-dashboard
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$DB_PASS|" .env
          sed -i "s|^SUPABASE_ACCESS_TOKEN=.*|SUPABASE_ACCESS_TOKEN=$SUPA_TOKEN|" .env
          sed -i "s|^SUPABASE_PUBLISHABLE_KEY=.*|SUPABASE_PUBLISHABLE_KEY=$SUPA_KEY|" .env
          sed -i "s|^REDIS_HOST=.*|REDIS_HOST=$REDIS_H|" .env
          sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$REDIS_P|" .env
          sed -i "s|^REDIS_URL=.*|REDIS_URL=$REDIS_U|" .env
          echo "✅ Secrets injected"
          grep -E "^DB_PASSWORD=|^REDIS_" .env | sed 's/=.*/=***/'

      - name: 9. Composer & NPM install
        run: |
          cd /home/runner/h-dashboard
          if [ ! -f "composer.json" ]; then
            echo "❌ composer.json not found"
            exit 1
          fi
          composer install --no-interaction --prefer-dist 2>&1
          npm install 2>&1
          echo "✅ Composer & NPM installed"

      - name: 10. Verify Database & Redis Connectivity
        run: |
          cd /home/runner/h-dashboard
          php artisan config:clear
          php artisan route:clear
          php artisan tinker --execute 'echo "DB: " . DB::select("SELECT 1 as test")[0]->test;'
          php artisan tinker --execute 'echo "Redis: " . (\Illuminate\Support\Facades\Redis::ping() ? "PONG" : "FAIL");'
          echo "✅ Cloud DB + Redis verified"

      - name: 11. Optimize
        run: |
          cd /home/runner/h-dashboard
          php artisan optimize
          echo "✅ Optimized"

      - name: 12. Build frontend assets
        run: |
          cd /home/runner/h-dashboard
          npm run build
          echo "✅ Frontend assets built"

      - name: 13. Install 9router globally and create symlink
        run: |
          npm install -g 9router
          if [ -f ~/.npm-global/bin/9router ]; then
            sudo ln -sf ~/.npm-global/bin/9router /usr/local/bin/9router
            echo "✅ 9router installed and symlinked to /usr/local/bin/9router"
          else
            echo "⚠️ 9router binary not found after installation"
          fi

      - name: 14. Restore 9router db backup & start hidden (tray)
        run: |
          export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"
          mkdir -p ~/.9router/db
          BACKUP_DIR="${GITHUB_WORKSPACE:-.}/9router"
          if [ -f "$BACKUP_DIR/data.sqlite" ]; then
            cp "$BACKUP_DIR/data.sqlite" ~/.9router/db/data.sqlite
            echo "✅ Restored 9router data.sqlite from repo backup"
          else
            echo "⚠️ 9router/data.sqlite not found in repo — starting fresh"
          fi
          nohup 9router --tray --skip-update -p 20128 > /tmp/9router.log 2>&1 &
          sleep 6
          if curl -fsS http://localhost:20128 > /dev/null 2>&1; then
            echo "✅ 9router is live on http://localhost:20128"
          else
            echo "⚠️ 9router did not come up — check /tmp/9router.log"
          fi

      - name: 15. Install Hermes Agent & restore config + MCPs + start Telegram gateway
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_CUSTOM_API_KEY }}
          GH_TOKEN: ${{ secrets.MY_PAT }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('TELEGRAM_BOT_TOKEN_{0}', env.WF_NAME)] }}
        run: |
          echo "✅ Using Telegram bot: $WF_NAME (token: TELEGRAM_BOT_TOKEN_${WF_NAME})"

          # 1. Install Hermes Agent
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "✅ Hermes Agent installed"
          export PATH="$HOME/.hermes/bin:$PATH"

          # 2. Restore the full Hermes config, memories, and skills from repo
          mkdir -p /home/runner/.hermes
          cp -r "${GITHUB_WORKSPACE:-.}/hermes/"* /home/runner/.hermes/ 2>/dev/null || true
          echo '✅ Restored /home/runner/.hermes from repo (hermes/ → ~/.hermes/)'
          # 3. Write the .env with secrets
          {
            echo "HERMES_CUSTOM_127_0_0_1_20128_API_KEY=${HERMES_API_KEY}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}"
            echo "TELEGRAM_HOME_CHANNEL=${TELEGRAM_ALLOWED_USERS}"
            echo "GITHUB_TOKEN=${GH_TOKEN}"
          } > ~/.hermes/.env
          chmod 600 ~/.hermes/.env
          echo "✅ Wrote ~/.hermes/.env from secrets"

          # 4. Project branch sync
          cd /home/runner/h-dashboard
          git config --global user.name "Shabakebehdasht"
          git config --global user.email "Shabakebehdasht@users.noreply.github.com"
          git remote add upstream https://github.com/asgarimehdi/h-dashboard.git 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${GH_T...git"
          git fetch upstream beta
          git fetch origin
          git checkout -- . 2>/dev/null || true
          if git ls-remote --heads origin "${WF_NAME}" | grep -q "${WF_NAME}"; then
            git checkout "${WF_NAME}"
            if git rebase "upstream/beta"; then
              git push origin "${WF_NAME}" --force-with-lease
              echo "✅ Synced existing branch ${WF_NAME} onto upstream/beta and pushed"
            else
              git rebase --abort
              git push origin "${WF_NAME}" --force-with-lease
              echo "⚠️ Rebase conflicted — kept ${WF_NAME} as-is"
            fi
          else
            git checkout -B "${WF_NAME}" "upstream/beta"
            git push -u origin "${WF_NAME}"
            echo "✅ Created + pushed branch ${WF_NAME} from upstream/beta"
          fi
          git remote set-url origin "$REPO_ORIGIN"

          # 5. Install MCP servers + skills
          npm install -g @colbymchenry/codegraph 2>/dev/null || npm install -g codegraph 2>/dev/null || true
          if command -v codegraph >/dev/null 2>&1; then
            (cd /home/runner/h-dashboard && codegraph init --index) || true
            echo "✅ CodeGraph installed + indexed"
          else
            echo "⚠️ codegraph CLI not installed — skipping"
          fi

          composer require laravel/boost --no-interaction 2>&1 | tail -3 || true
          if [ -f /home/runner/h-dashboard/artisan ]; then
            php artisan boost:update 2>/dev/null || true
            echo "✅ Laravel Boost package present"
          fi

          npx -y skills add shadcn/improve 2>&1 | tail -3 || true
          echo "✅ shadcn/improve skill added"

          hermes mcp install context7 2>&1 || true
          echo "✅ Context7 MCP installed"

          # 6. Write mcp_servers block into config.yaml
          if ! grep -q "mcp_servers" ~/.hermes/config.yaml; then
            HD_ENV=/home/runner/h-dashboard/.env
            if [ -f "$HD_ENV" ]; then
              PG_HOST=$(grep -E '^DB_HOST=' "$HD_ENV" | cut -d= -f2-)
              PG_PORT=$(grep -E '^DB_PORT=' "$HD_ENV" | cut -d= -f2-)
              PG_DB=$(grep -E '^DB_DATABASE=' "$HD_ENV" | cut -d= -f2-)
              PG_USER=$(grep -E '^DB_USERNAME=' "$HD_ENV" | cut -d= -f2-)
              PG_PASS=$(grep -E '^DB_PASSWORD=' "$HD_ENV" | cut -d= -f2-)
              PG_URL="postgresql://${PG_USER}:***@${PG_HOST}:${PG_PORT}/${PG_DB}"
            else
              PG_URL="postgresql://postgres:***@aws-0-eu-central-1.pooler.supabase.com:6543/postgres"
            fi
            printf '\nmcp_servers:\n  codegraph:\n    command: codegraph\n    args: ["serve", "--mcp"]\n    cwd: /home/runner/h-dashboard\n  laravel-boost:\n    command: php\n    args: ["artisan", "boost:mcp"]\n    cwd: /home/runner/h-dashboard\n  postgis:\n    command: uvx\n    args: ["mcp-postgis"]\n    env:\n      MCP_POSTGIS_DATABASE_URL: "%s"\n      MCP_POSTGIS_MODE: read_only\n' "$PG_URL" >> ~/.hermes/config.yaml
            echo "✅ Appended mcp_servers to config.yaml"
          else
            echo "✅ mcp_servers already present in config.yaml"
          fi

          # 7. Start Hermes gateway
          nohup hermes gateway run --replace > /tmp/hermes-gateway.log 2>&1 &
          sleep 6
          if curl -fsS http://127.0.0.1:20128 > /dev/null 2>&1; then
            echo "✅ 9router still live; Hermes gateway launching…"
          fi
          echo "✅ Hermes gateway launch attempted (logs: /tmp/hermes-gateway.log)"

          # 8. Send seed message
          SEED_FILE="${GITHUB_WORKSPACE:-.}/hermes/seed-message.txt"
          if [ -f "$SEED_FILE" ]; then
            sleep 3
            hermes send --to telegram --file "$SEED_FILE" \
              && echo "✅ Seed message sent to Telegram" \
              || echo "⚠️ Seed message failed to send"
          else
            echo "⚠️ hermes/seed-message.txt not found — skipping"
          fi

      - name: 16. Start Laravel Development Server
        run: |
          cd /home/runner/h-dashboard
          nohup php artisan serve --host=0.0.0.0 > /dev/null 2>&1 &
          echo "✅ Laravel server started on port 8000"

      - name: 17. Server Keep-Alive (5h 55m)
        run: |
          for i in {1..355}; do
            sleep 60
            echo "[$i/355] Server is active (SSH + Laravel on port 8000)..."
          done

      - name: 18. Tailscale Logout (cleanup on shutdown)
        if: always()
        run: |
          sudo tailscale logout || true
          echo "✅ Tailscale logout executed — hostname freed"
